<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main}">
<head>
    <title>比赛成绩 - 公开浏览</title>
</head>
<body>
<div layout:fragment="content">
    <div class="container-fluid py-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h4 class="mb-0">
                <i class="bi bi-award text-primary me-2"></i>比赛成绩
            </h4>
            <span class="badge bg-info">公开浏览</span>
        </div>

        <div th:if="${results.totalElements == 0}" class="text-center text-muted py-5">
            <i class="bi bi-clipboard-data fs-1"></i>
            <p class="mt-2">暂无已公布的成绩</p>
        </div>

        <div class="table-responsive" th:if="${results.totalElements > 0}">
            <table class="table table-hover">
                <thead class="table-light">
                <tr>
                    <th>排名</th>
                    <th>运动员</th>
                    <th>项目</th>
                    <th>赛事</th>
                    <th>成绩</th>
                    <th>备注</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="r : ${results}">
                    <td>
                        <span th:if="${r.rank}" class="fw-bold" th:text="${r.rank}">1</span>
                    </td>
                    <td th:text="${@desensitizationUtil.maskName(r.athlete?.name)}">运动员</td>
                    <td th:text="${r.sportType?.name}">项目</td>
                    <td th:text="${r.schedule?.event?.name}">赛事</td>
                    <td>
                        <span class="fw-bold" th:text="${r.scoreText}">成绩</span>
                        <span th:if="${r.isPersonalBest}" class="badge bg-success ms-1">PB</span>
                        <span th:if="${r.isSeasonBest}" class="badge bg-warning ms-1">SB</span>
                        <span th:if="${r.recordType != '无'}" class="badge bg-danger ms-1" th:text="${r.recordType}">纪录</span>
                    </td>
                    <td th:text="${r.remark}"></td>
                </tr>
                </tbody>
            </table>
        </div>

        <!-- 分页 -->
        <nav th:if="${results.totalPages > 1}" class="mt-4">
            <ul class="pagination justify-content-center">
                <li class="page-item" th:classappend="${results.number == 0} ? 'disabled'">
                    <a class="page-link" th:href="@{/public/results(page=${results.number - 1})}">上一页</a>
                </li>
                <li class="page-item" th:each="i : ${#numbers.sequence(0, results.totalPages - 1)}"
                    th:classappend="${i == results.number} ? 'active'">
                    <a class="page-link" th:href="@{/public/results(page=${i})}" th:text="${i + 1}">1</a>
                </li>
                <li class="page-item" th:classappend="${results.number == results.totalPages - 1} ? 'disabled'">
                    <a class="page-link" th:href="@{/public/results(page=${results.number + 1})}">下一页</a>
                </li>
            </ul>
        </nav>
    </div>
</div>
</body>
</html>
